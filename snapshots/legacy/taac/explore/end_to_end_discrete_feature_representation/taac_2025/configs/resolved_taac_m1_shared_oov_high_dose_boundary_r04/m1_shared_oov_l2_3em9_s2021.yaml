model:
  name: din
  embedding_dim: 16
  attention_dim: 32
  mlp_dims:
  - 128
  - 64
  dropout: 0.1
  use_sparse_features: true
  shared_item_quantization_deduplicate_occurrences: true
  zero_anchor_identity_quantization:
    enabled: true
    identity_fields:
    - shared_item_id
    codebook_size: 20000
    codebook_size_by_field:
      shared_item_id: 20000
    num_subspaces: 1
    num_residual_levels: 1
    base_embedding_mode: split_zero_base
    private_row_initialization_mode: train_first_touch_deterministic_code
    assignment_stability_mode: free_nearest
    assignment_freeze_fraction: 0.0
    assignment_switch_relative_improvement: 0.0
    continuous_residual: false
    task_codebook_gradient_mode: legacy_hard_plus_soft
    commitment_weight: 0.0
    codebook_loss_weight: 1.0
    codebook_ramp_fraction: 0.0
    codebook_release_fraction: 0.0
    regularization_ramp_fraction: 0.0
    regularization_release_fraction: 0.0
    temperature_start: 1.0
    temperature_end: 0.3
    code_init_radius: 0.2
    margin: 0.1
    distance_backend: gemm
    distance_row_chunk_size: 1024
    compact_distance_outputs: true
    codebook_transform_mode: none
    code_logit_bias_mode: none
    zero_l2_weight: 0.0
    initialization_seed: 2021
    isolate_initialization_rng: true
    audit_enabled: false
    sparse_batch_diagnostics: true
    defer_cumulative_diagnostics: true
training:
  batch_size: 2048
  lr: 0.001
  optimizer: adam
  optimizer_foreach: false
  weight_decay: 0.0
  zero_anchor_full_table_l2:
    enabled: true
    target: prequantization_assignment_table
    identity_fields:
    - shared_item_id
    coefficient: 3.0e-09
    first_regularized_row: 4
    release_fraction: 0.0
    ramp_fraction: 0.0
    application_order: after_global_clip
  epochs: 1
  num_workers: 4
  deterministic: true
  grad_clip: 1.0
  use_amp: false
  log_every: 500
  eval_every: 0
  suppress_effect_metric_logs: true
  save_dir: /tmp/taac_m1_shared_oov_high_dose_boundary_r04/m1_shared_oov_l2_3em9_s2021
seed: 2021
