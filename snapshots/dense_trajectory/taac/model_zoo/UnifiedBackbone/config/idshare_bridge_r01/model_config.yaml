Base:
  model_root: /tmp/idshare-ub-bridge/checkpoints
  num_workers: 0
  verbose: 1
  early_stop_patience: 2
  pickle_feature_encoder: true
  save_best_only: true
  eval_steps: null
  debug_mode: false
  group_id: null
  use_features: null
  feature_specs:
  - name:
    - feat_106
    - feat_107
    - feat_108
    - feat_110
    feature_encoder: layers.MaskedSumPooling()
  feature_config: null
  tensorboard: false
IDShareUnifiedMixer_taac_continuous_s2021:
  model: IDShareUnifiedMixer
  dataset_id: taac2025_time_split_side_top4
  data_loader_class: fuxictr_ext.taac2025.idshare_taac_dataloader.TaacSharedIdentityDataLoader
  loss: binary_crossentropy
  metrics:
  - logloss
  - AUC
  task: binary_classification
  optimizer: adam
  learning_rate: 0.001
  embedding_regularizer: 0
  net_regularizer: 0
  batch_size: 2048
  embedding_dim: 16
  d_model: 64
  num_layers: 2
  ffn_mult: 2
  ffn_type: per_token_swiglu
  block_norm: pre
  num_ns_tokens: 11
  seq_tokenizer: recent_k_plus_equal_chunks
  num_seq_tokens: 5
  recent_k: 2
  concat_mode: s_ns
  use_semantic_bias: false
  pooling: ns_tokens_mean
  seq_pooling: attn
  mlp_dims:
  - 128
  - 64
  dropout: 0.0
  norm_type: layer_norm
  emit_sequence_timestamp: false
  sequence_side_fields:
  - 102
  - 115
  - 119
  - 120
  sequence_fields:
  - item_seq
  - item_seq__feat_102
  - item_seq__feat_115
  - item_seq__feat_119
  - item_seq__feat_120
  epochs: 1
  shuffle: true
  seed: 2021
  monitor: AUC
  monitor_mode: max
  maxlen: 100
  user_array_maxlen: 10
  max_gradient_norm: 1.0
  idshare_enabled: false
  idshare_quantizer_config:
    enabled: true
    identity_fields:
    - shared_item_id
    codebook_size: 20000
    codebook_size_by_field:
      shared_item_id: 20000
    num_subspaces: 1
    num_residual_levels: 1
    multi_codebook_mode: serial_residual
    continuous_residual: false
    base_embedding_mode: split_zero_base
    private_row_initialization_mode: train_first_touch_deterministic_code
    assignment_stability_mode: free_nearest
    assignment_freeze_fraction: 0.0
    assignment_switch_relative_improvement: 0.0
    task_codebook_gradient_mode: legacy_hard_plus_soft
    temperature_start: 1.0
    temperature_end: 0.3
    margin: 0.1
    code_init_radius: 0.2
    zero_l2_weight: 0.0
    commitment_weight: 0.0
    codebook_loss_weight: 1.0
    regularization_release_fraction: 0.0
    regularization_ramp_fraction: 0.0
    codebook_release_fraction: 0.0
    codebook_ramp_fraction: 0.0
    distance_backend: gemm
    distance_row_chunk_size: 1024
    compact_distance_outputs: true
    sparse_batch_diagnostics: true
    defer_cumulative_diagnostics: true
    audit_enabled: false
    code_logit_bias_mode: none
    codebook_transform_mode: none
    initialization_seed: 2021
    isolate_initialization_rng: true
  idshare_deduplicate_occurrences: true
  train_input_seen_mask_path: /data/taac2025/10m-time-split-train-val-test-20260531/north_star_identity_cache/taac_train_input_seen_mask_r01.npy
  train_input_seen_mask_sha256: 28c508568071ff0f963f4bbe1b8d34c62a591e64716a1566169ca11383e58406
  shared_item_table_cardinality: 17487680
  expected_raw_data_root: /data/taac2025/10m-time-split-train-val-test-20260531
  expected_samples_path_by_split: &id001
    train: /data/taac2025/10m-time-split-train-val-test-20260531/train/samples.parquet
    validation: /data/taac2025/10m-time-split-train-val-test-20260531/val/samples.parquet
  uses_test_dataset: false
  uses_test_labels: false
